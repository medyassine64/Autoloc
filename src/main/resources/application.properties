spring.application.name=JouiniMohamedYassine4IET

# --- Configuration de la base de données ---
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuration JPA / Hibernate ---
# Affiche les requêtes SQL dans la console (utile pour le débogage)
spring.jpa.show-sql=true
# Formate joliment le SQL affiché
spring.jpa.properties.hibernate.format_sql=true
# Met à jour le schéma de la base de données au démarrage (crée les tables manquantes)

spring.jpa.hibernate.ddl-auto=update
#create-drop

# Utilise MySQL comme dialecte
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Configuration du serveur Web ---
server.port=8089
server.servlet.context-path=/api